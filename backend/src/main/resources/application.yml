server:
  port: ${PORT:8080}

spring:
  application:
    name: beat
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true

tinyfish:
  api-key: ${TINYFISH_API_KEY}

groq:
  api-key: ${GROQ_API_KEY}

resend:
  api-key: ${RESEND_API_KEY}
  recipient-email: ${DIGEST_RECIPIENT_EMAIL}
  from-email: ${RESEND_FROM_EMAIL}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

auth:
  secret: ${AUTH_SECRET}

internal:
  secret: ${INTERNAL_SECRET:default_internal_secret_key}

digest:
  freshness:
    max-age-hours: 168
