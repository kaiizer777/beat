services:
  # Spring Boot 3.4 Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beat-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - TINYFISH_API_KEY=${TINYFISH_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DIGEST_RECIPIENT_EMAIL=${DIGEST_RECIPIENT_EMAIL}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_FROM_EMAIL=${BREVO_FROM_EMAIL}
      - EMAIL_RESEND_TARGET=${EMAIL_RESEND_TARGET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,https://beat-alpha.vercel.app}
      - AUTH_SECRET=${AUTH_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    networks:
      - beat-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 35s

  # Next.js 16 Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
        - AUTH_SECRET=${AUTH_SECRET}
    container_name: beat-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
      - DATABASE_URL=${DATABASE_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_RESEND_KEY=${AUTH_RESEND_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      - RESEND_TARGET_EMAIL=${RESEND_TARGET_EMAIL}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_FROM_EMAIL=${BREVO_FROM_EMAIL}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - beat-network

  # Optional local PostgreSQL service for offline development
  # Run with: docker compose --profile local-db up --build
  postgres:
    image: postgres:16-alpine
    container_name: beat-postgres
    restart: unless-stopped
    profiles:
      - local-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=beatdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - beat-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d beatdb"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  beat-network:
    driver: bridge

volumes:
  postgres_data:
